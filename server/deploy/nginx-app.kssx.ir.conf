# app.kssx.ir: EYVAN for iPhone and the browser (#5183). The built web app (web/dist → /var/www/eyvan-web) and its
# server calls on the same address: /api/… → azar-auth on loopback, so no other domain shows (Amin #5135).
# The exact server_name wins over the *.kssx.ir wildcard in digimeno.conf.
limit_req_zone $binary_remote_addr zone=eyvan_api:2m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name app.kssx.ir;
    location /.well-known/acme-challenge/ { root /var/www/certbot-webroot; }
    location / { return 301 https://app.kssx.ir$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.kssx.ir;
    ssl_certificate     /etc/letsencrypt/live/kssx.ir/fullchain.pem;   # *.kssx.ir
    ssl_certificate_key /etc/letsencrypt/live/kssx.ir/privkey.pem;

    root /var/www/eyvan-web;
    client_max_body_size 20m;

    # Amin #5199: never inside another site's frame; only this address's own files, wasm for the database engine
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Amin #5197: the admin API is for the billing panel on this machine only
    location ^~ /api/admin { return 404; }

    location /api/ {
        limit_req zone=eyvan_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # built files carry their hash in the name
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }
}
