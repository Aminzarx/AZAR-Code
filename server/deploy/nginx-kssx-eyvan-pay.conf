# EYVAN token purchase (#5245, brain 2026-10-25): the bank return and the «payment done» page on kssx.ir, so users never
# see another domain (Amin #5135). Billing verifies on loopback and 303s to /pay/eyvan/done; that page is azar-auth's.
location ~ "^/pay/eyvan/api/v1/eyvan-pay/callback/(etp_[A-Za-z0-9]{8,40})$" {
    if ($kss_bad_bot) { return 403; }
    limit_req zone=kb_pay burst=10 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/kssx-billing-proxy.inc;
    proxy_pass http://127.0.0.1:7520/billing/api/v1/eyvan-pay/callback/$1$is_args$args;
}
location = /pay/eyvan/done {
    limit_except GET HEAD { deny all; }
    limit_req zone=kb_pay burst=10 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://127.0.0.1:8787/tokens/paid$is_args$args;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
