name: Deploy Auth Backend

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Trust the VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync server source to the VPS
        # The VPS sandbox container only has git/node/python3/build-essential
        # (server/README.md), not rsync — tar-over-SSH needs nothing beyond
        # plain OpenSSH on either end. node_modules/data are excluded the
        # same way rsync's --exclude did; npm ci below reinstalls
        # node_modules fresh every deploy anyway.
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'rm -rf ~/azar-server && mkdir -p ~/azar-server'
          tar czf - -C server --exclude node_modules --exclude data . \
            | ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              'tar xzf - -C ~/azar-server'

      - name: Install dependencies and (re)start the service
        # pm2 is a regular dependency of server/ (not global) — the sandbox
        # user has no write access to npm's global prefix (confirmed by an
        # earlier failed run: EACCES on /usr/lib/node_modules), and `npx
        # pm2` resolves to the local install that `npm ci` just placed in
        # node_modules/.bin, needing no sudo and no global state at all.
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd ~/azar-server
            npm ci --omit=dev
            npx pm2 describe azar-api > /dev/null 2>&1 && npx pm2 restart azar-api --update-env || npx pm2 start src/index.js --name azar-api
            npx pm2 save
          '
