name: Android Build

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch: {}

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        # Building all 4 ABIs (armeabi-v7a/arm64-v8a/x86/x86_64) at once compiles
        # op-sqlite (SQLCipher) and quick-crypto (OpenSSL/ncrypto) native code in
        # parallel across all of them — on the standard ubuntu-latest runner's
        # ~7GB RAM this repeatedly exhausted memory and the job was silently
        # killed mid-compile (twice, no compiler error, just a dead process).
        # Scoping this CI debug build to arm64-v8a only (what a real Xiaomi
        # phone needs to install and run it) and capping Gradle's worker count
        # cuts concurrent native compiles enough to stay within the runner's
        # memory budget. This only overrides the build for this CI invocation
        # via -P/-D flags; android/gradle.properties keeps its multi-ABI
        # default for local/release builds.
        run: >-
          ./gradlew assembleDebug --no-daemon
          -PreactNativeArchitectures=arm64-v8a
          -Dorg.gradle.workers.max=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: azar-crm-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
