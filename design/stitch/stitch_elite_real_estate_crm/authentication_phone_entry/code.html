<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>EstatePro CRM - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#b9eeab",
                        "tertiary": "#000000",
                        "outline": "#75777a",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#44474a",
                        "primary-fixed-dim": "#c6c6c9",
                        "surface-container": "#edeeef",
                        "outline-variant": "#c5c6ca",
                        "inverse-surface": "#2e3132",
                        "on-primary-container": "#838486",
                        "on-secondary-container": "#3f6d38",
                        "surface-container-high": "#e7e8e9",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#002201",
                        "on-background": "#191c1d",
                        "on-tertiary-fixed": "#001f26",
                        "on-primary": "#ffffff",
                        "primary-container": "#1a1c1e",
                        "on-secondary": "#ffffff",
                        "on-surface": "#191c1d",
                        "surface-container-highest": "#e1e3e4",
                        "on-tertiary-container": "#618a96",
                        "surface-tint": "#5d5e61",
                        "primary-fixed": "#e2e2e5",
                        "surface": "#f8f9fa",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#bfe9f7",
                        "on-tertiary-fixed-variant": "#224c57",
                        "surface-dim": "#d9dadb",
                        "primary": "#000101",
                        "background": "#f8f9fa",
                        "secondary": "#3b6934",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-bright": "#f8f9fa",
                        "tertiary-fixed-dim": "#a3cdda",
                        "surface-container-low": "#f3f4f5",
                        "secondary-fixed": "#bcf0ae",
                        "tertiary-container": "#001f26",
                        "on-primary-fixed-variant": "#454749",
                        "on-secondary-fixed-variant": "#23501e",
                        "secondary-fixed-dim": "#a1d494",
                        "surface-variant": "#e1e3e4",
                        "inverse-on-surface": "#f0f1f2",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#1a1c1e",
                        "inverse-primary": "#c6c6c9"
                    },
                    "borderRadius": {
                        "sm": "0.125rem",
                        "DEFAULT": "0.25rem",
                        "md": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "base": "8px",
                        "margin-desktop": "32px",
                        "container-max-width": "1200px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Geist"],
                        "display": ["Geist"],
                        "label-sm": ["Geist"],
                        "headline-lg": ["Geist"],
                        "body-md": ["Inter"],
                        "headline-md": ["Geist"],
                        "label-md": ["Geist"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
        /* Custom subtle focus ring */
        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 1px #000101;
            border-color: #000101;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-md antialiased p-margin-mobile">
<!-- Transactional/Linear Intent: Navigations are suppressed -->
<main class="w-full max-w-sm mx-auto flex flex-col bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-outline-variant/30 overflow-hidden relative">
<!-- Top decorative bar indicating premium status -->
<div class="h-1 w-full bg-primary absolute top-0 left-0"></div>
<div class="p-gutter pt-8 pb-8 flex flex-col h-full">
<!-- Header Section -->
<header class="mb-10 text-center">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-low mb-6">
<span class="material-symbols-outlined text-primary text-[24px]">corporate_fare</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your EstatePro account.</p>
</header>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-6 flex-grow" method="POST">
<!-- Phone Input Group -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="phone">Phone Number</label>
<div class="flex flex-row items-center bg-surface-container-lowest border border-outline-variant rounded-lg transition-colors input-focus-ring group">
<!-- Country Code Selector (Simplified) -->
<div class="flex items-center pl-3 pr-2 py-3 border-r border-outline-variant/50 cursor-pointer hover:bg-surface-container-low transition-colors rounded-l-lg">
<span class="font-body-md text-body-md text-primary mr-1">+1</span>
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">expand_more</span>
</div>
<!-- Phone Input -->
<input autocomplete="tel" class="flex-grow bg-transparent border-none focus:ring-0 text-primary font-body-lg text-body-lg py-3 px-3 placeholder-outline-variant w-full" id="phone" name="phone" placeholder="(555) 000-0000" required="" type="tel"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-lg flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all mt-4 shadow-sm" type="submit">
                    Get Verification Code
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer / Secondary Actions -->
<div class="mt-8 pt-6 border-t border-outline-variant/30 flex flex-col items-center gap-4">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors underline decoration-outline-variant underline-offset-4" href="#">
                    Enter Referral Code
                </a>
<p class="font-label-sm text-label-sm text-outline text-center mt-2">
                    By proceeding, you agree to our <a class="text-on-surface-variant hover:text-primary" href="#">Terms</a> and <a class="text-on-surface-variant hover:text-primary" href="#">Privacy Policy</a>.
                </p>
</div>
</div>
</main>
<!-- Subtle background decoration -->
<div class="fixed inset-0 pointer-events-none z-[-1] opacity-40 mix-blend-multiply" style="background-image: radial-gradient(circle at 50% 0%, #e1e3e4 0%, transparent 60%);"></div>
<script>
        // Simple input formatter for phone number (US format as example)
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });
    </script>
</body></html>
