<style>

                EstatePro is currently invite-only. Please enter your professional referral code to continue.
            </p>
<!-- Referral Code Form -->
<form class="w-full flex flex-col gap-6" id="referralForm" onsubmit="event.preventDefault(); showError();">
<!-- Input Group -->
<div class="relative w-full text-left" id="inputContainer">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-1" for="referralCode">Referral Code</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant z-10 select-none">
                            tag
                        </span>
<input autocomplete="off" class="w-full bg-surface-container-low border-b-2 border-outline-variant focus:border-primary px-12 py-4 rounded-t-lg outline-none transition-colors font-body-lg text-body-lg text-primary placeholder:text-outline/50 uppercase tracking-wider" id="referralCode" placeholder="e.g. EP-2024-PRO" spellcheck="false" type="text">
<!-- Error Icon (Hidden initially) -->
<span class="material-symbols-outlined absolute right-4 text-error hidden z-10 select-none" id="errorIcon">
                            error
                        </span>
</div>
<!-- Inline Error Message -->
<div class="hidden items-center gap-2 mt-2 ml-1 text-error" id="errorMessage">
<span class="font-label-md text-label-md">Invalid Referral Code. Please try again.</span>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-label-md text-label-md hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center gap-2 mt-2" type="submit">

                        arrow_forward
                    </span>
</button>

<!-- Footer Links -->

<script>
        function showError() {
            const input = document.getElementById('referralCode');
            const container = document.getElementById('inputContainer');
            const errorIcon = document.getElementById('errorIcon');
            const errorMessage = document.getElementById('errorMessage');

            // Add error styles
            input.classList.remove('border-outline-variant', 'focus:border-primary', 'bg-surface-container-low');
            input.classList.add('border-error', 'focus:border-error', 'bg-error-container/20', 'text-error');
            
            // Show error elements
            errorIcon.classList.remove('hidden');
            errorMessage.classList.remove('hidden');
            errorMessage.classList.add('flex');

            // Trigger shake animation
            container.classList.remove('shake-animation');
            void container.offsetWidth; // trigger reflow
            container.classList.add('shake-animation');

            // Reset on input focus
            input.addEventListener('focus', function resetError() {
                input.classList.add('border-outline-variant', 'focus:border-primary', 'bg-surface-container-low');
                input.classList.remove('border-error', 'focus:border-error', 'bg-error-container/20', 'text-error');
                
                errorIcon.classList.add('hidden');
                errorMessage.classList.add('hidden');
                errorMessage.classList.remove('flex');
                
                input.removeEventListener('focus', resetError);
            });
        }
    </script>
