<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Property Creation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#b9eeab",
                        "tertiary": "#000000",
                        "outline": "#75777a",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#44474a",
                        "primary-fixed-dim": "#c6c6c9",
                        "surface-container": "#edeeef",
                        "outline-variant": "#c5c6ca",
                        "inverse-surface": "#2e3132",
                        "on-primary-container": "#838486",
                        "on-secondary-container": "#3f6d38",
                        "surface-container-high": "#e7e8e9",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#002201",
                        "on-background": "#191c1d",
                        "on-tertiary-fixed": "#001f26",
                        "on-primary": "#ffffff",
                        "primary-container": "#1a1c1e",
                        "on-secondary": "#ffffff",
                        "on-surface": "#191c1d",
                        "surface-container-highest": "#e1e3e4",
                        "on-tertiary-container": "#618a96",
                        "surface-tint": "#5d5e61",
                        "primary-fixed": "#e2e2e5",
                        "surface": "#f8f9fa",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#bfe9f7",
                        "on-tertiary-fixed-variant": "#224c57",
                        "surface-dim": "#d9dadb",
                        "primary": "#000101",
                        "background": "#f8f9fa",
                        "secondary": "#3b6934",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-bright": "#f8f9fa",
                        "tertiary-fixed-dim": "#a3cdda",
                        "surface-container-low": "#f3f4f5",
                        "secondary-fixed": "#bcf0ae",
                        "tertiary-container": "#001f26",
                        "on-primary-fixed-variant": "#454749",
                        "on-secondary-fixed-variant": "#23501e",
                        "secondary-fixed-dim": "#a1d494",
                        "surface-variant": "#e1e3e4",
                        "inverse-on-surface": "#f0f1f2",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#1a1c1e",
                        "inverse-primary": "#c6c6c9"
                    },
                    "borderRadius": {
                        "sm": "0.125rem",
                        "DEFAULT": "0.25rem",
                        "md": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "base": "8px",
                        "margin-desktop": "32px",
                        "container-max-width": "1200px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Geist"],
                        "display": ["Geist"],
                        "label-sm": ["Geist"],
                        "headline-lg": ["Geist"],
                        "body-md": ["Inter"],
                        "headline-md": ["Geist"],
                        "label-md": ["Geist"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d9dadb;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #c5c6ca;
        }
        
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Bottom sheet animation */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .bottom-sheet-anim {
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        /* Segmented Control sliding indicator */
        .segmented-indicator {
            transition: transform 0.2s ease, width 0.2s ease;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-variant font-body-md text-on-surface antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Mock Canvas (to show it's a bottom sheet overlay) -->
<div class="absolute inset-0 pointer-events-none opacity-50 p-6 flex flex-col gap-4 filter blur-[2px]">
<div class="h-12 w-48 bg-surface-container rounded-lg"></div>
<div class="flex gap-4">
<div class="h-64 w-1/3 bg-surface-container rounded-xl"></div>
<div class="h-64 w-1/3 bg-surface-container rounded-xl"></div>
<div class="h-64 w-1/3 bg-surface-container rounded-xl"></div>
</div>
</div>
<!-- Scrim / Backdrop -->
<div class="fixed inset-0 bg-primary/20 backdrop-blur-sm z-40 transition-opacity"></div>
<!-- Bottom Sheet Container (Simulating Mobile on Desktop, Full Width on Mobile) -->
<div class="fixed bottom-0 w-full md:w-[480px] md:left-1/2 md:-translate-x-1/2 bg-surface rounded-t-[16px] md:rounded-[16px] md:bottom-auto md:top-1/2 md:-translate-y-1/2 z-50 shadow-2xl flex flex-col max-h-[795px] bottom-sheet-anim overflow-hidden border border-outline-variant/30">
<!-- Drag Handle (Mobile only visual cue) -->
<div class="w-full flex justify-center pt-3 pb-1 md:hidden">
<div class="w-10 h-1 bg-outline-variant rounded-full opacity-50"></div>
</div>
<!-- Header -->
<div class="flex items-center justify-between px-6 py-4 border-b border-outline-variant/50 shrink-0">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">New Listing</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1" id="step-indicator">Step 1 of 2: Basic Info</p>
</div>
<button class="p-3 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors min-w-[48px] min-h-[48px] flex items-center justify-center">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto px-6 py-6 relative" id="form-content">
<!-- Step 1: Basic Info -->
<div class="flex flex-col gap-8 transition-opacity duration-300" id="step-1">
<!-- Property Type Segmented Control -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface">Property Type</label>
<div class="relative flex p-1 bg-surface-container-low rounded-lg border border-outline-variant/50 w-full" id="property-type-control">
<!-- Sliding Indicator -->
<div class="absolute left-1 top-1 bottom-1 w-[calc(33.333%-0.33rem)] bg-on-tertiary rounded shadow-sm segmented-indicator z-0" id="prop-type-indicator"></div>
<button class="relative z-10 flex-1 py-2 text-center font-label-md text-label-md text-primary transition-colors prop-type-btn active" data-index="0">House</button>
<button class="relative z-10 flex-1 py-2 text-center font-label-md text-label-md text-on-surface-variant transition-colors prop-type-btn" data-index="1">Apartment</button>
<button class="relative z-10 flex-1 py-2 text-center font-label-md text-label-md text-on-surface-variant transition-colors prop-type-btn" data-index="2">Commercial</button>
</div>
</div>
<!-- Price Input / Slider Hybrid -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface flex justify-between">
<span>Listing Price</span>
<span class="text-primary font-body-md text-body-md" id="price-display">$850,000</span>
</label>
<input class="w-full h-1 bg-surface-container-high rounded-full appearance-none cursor-pointer accent-primary" id="price-slider" max="5000000" min="100000" step="50000" type="range" value="850000"/>
<div class="flex justify-between font-label-sm text-label-sm text-on-surface-variant mt-1">
<span>$100k</span>
<span>$5M+</span>
</div>
</div>
<!-- Location Autocomplete (Minimal Input) -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface">Location</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors text-[20px]">location_on</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow placeholder:text-on-surface-variant/70" placeholder="Start typing address..." type="text" value="123 Serenity Lane"/>
</div>
</div>
</div>
<!-- Step 2: Details (Initially hidden, but kept in DOM for quick toggle) -->
<div class="hidden flex-col gap-8 transition-opacity duration-300 opacity-0" id="step-2">
<!-- Specs: Beds/Baths Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface">Bedrooms</label>
<div class="flex items-center justify-between bg-surface-container-low border border-outline-variant/50 rounded-lg p-1">
<button class="p-3 min-w-[48px] min-h-[48px] flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined text-[20px]">remove</span></button>
<span class="font-body-md text-body-md font-medium text-on-surface">3</span>
<button class="p-3 min-w-[48px] min-h-[48px] flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined text-[20px]">add</span></button>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface">Bathrooms</label>
<div class="flex items-center justify-between bg-surface-container-low border border-outline-variant/50 rounded-lg p-1">
<button class="p-3 min-w-[48px] min-h-[48px] flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined text-[20px]">remove</span></button>
<span class="font-body-md text-body-md font-medium text-on-surface">2.5</span>
<button class="p-3 min-w-[48px] min-h-[48px] flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined text-[20px]">add</span></button>
</div>
</div>
</div>
<!-- Area Input -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface">Internal Area</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg py-3 pl-4 pr-16 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" placeholder="0" type="number" value="2400"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 font-label-md text-label-md text-on-surface-variant">SQFT</span>
</div>
</div>
<!-- Amenities Multi-select Chips -->
<div class="flex flex-col gap-3">
<label class="font-label-md text-label-md text-on-surface">Key Amenities</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-1.5 rounded-full border border-primary bg-primary text-on-primary font-label-sm text-label-sm transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">check</span> Pool
                        </button>
<button class="px-4 py-1.5 rounded-full border border-outline-variant bg-surface text-on-surface-variant hover:bg-surface-container font-label-sm text-label-sm transition-colors">Garage</button>
<button class="px-4 py-1.5 rounded-full border border-primary bg-primary text-on-primary font-label-sm text-label-sm transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">check</span> Smart Home
                        </button>
<button class="px-4 py-1.5 rounded-full border border-outline-variant bg-surface text-on-surface-variant hover:bg-surface-container font-label-sm text-label-sm transition-colors">Solar</button>
<button class="px-4 py-1.5 rounded-full border border-outline-variant bg-surface text-on-surface-variant hover:bg-surface-container font-label-sm text-label-sm transition-colors">Security Sys</button>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="p-6 border-t border-outline-variant/50 bg-surface flex gap-4 shrink-0">
<button class="hidden flex-1 py-3 px-4 rounded-lg border border-outline-variant text-on-surface font-label-md text-label-md hover:bg-surface-container transition-colors items-center justify-center" id="btn-back">
                Back
            </button>
<button class="flex-1 py-3 px-4 rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:bg-tertiary transition-colors items-center justify-center flex gap-2 w-full" id="btn-next">
                Continue <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<button class="hidden flex-1 py-3 px-4 rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:bg-tertiary transition-colors items-center justify-center gap-2" id="btn-save">
                Save Listing <span class="material-symbols-outlined text-[18px]">check_circle</span>
</button>
</div>
</div>
<script>
        // Simple logic to handle Step transitions
        const btnNext = document.getElementById('btn-next');
        const btnBack = document.getElementById('btn-back');
        const btnSave = document.getElementById('btn-save');
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const stepIndicator = document.getElementById('step-indicator');

        btnNext.addEventListener('click', () => {
            step1.classList.add('hidden', 'opacity-0');
            step1.classList.remove('flex');
            
            step2.classList.remove('hidden');
            step2.classList.add('flex');
            
            // small delay for transition effect
            setTimeout(() => {
                step2.classList.remove('opacity-0');
            }, 50);

            btnNext.classList.add('hidden');
            btnBack.classList.remove('hidden');
            btnBack.classList.add('flex');
            btnSave.classList.remove('hidden');
            btnSave.classList.add('flex');
            btnSave.parentElement.classList.remove('w-full');
            
            stepIndicator.textContent = "Step 2 of 2: Details";
        });

        btnBack.addEventListener('click', () => {
            step2.classList.add('hidden', 'opacity-0');
            step2.classList.remove('flex');
            
            step1.classList.remove('hidden');
            step1.classList.add('flex');
            
            setTimeout(() => {
                step1.classList.remove('opacity-0');
            }, 50);

            btnBack.classList.add('hidden');
            btnSave.classList.add('hidden');
            btnNext.classList.remove('hidden');
            
            stepIndicator.textContent = "Step 1 of 2: Basic Info";
        });

        // Price slider logic
        const priceSlider = document.getElementById('price-slider');
        const priceDisplay = document.getElementById('price-display');
        
        priceSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            priceDisplay.textContent = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);
        });

        // Segmented Control Logic
        const propBtns = document.querySelectorAll('.prop-type-btn');
        const indicator = document.getElementById('prop-type-indicator');

        propBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Remove active styling from all
                propBtns.forEach(b => {
                    b.classList.remove('text-primary');
                    b.classList.add('text-on-surface-variant');
                });
                
                // Add active styling to clicked
                e.target.classList.add('text-primary');
                e.target.classList.remove('text-on-surface-variant');
                
                // Move indicator
                const index = parseInt(e.target.dataset.index);
                indicator.style.transform = `translateX(${index * 100}%)`;
            });
        });
    </script>
</body></html>
