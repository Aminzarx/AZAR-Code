<style>
        .input-slot {
            width: 48px;
            height: 56px;
            text-align: center;
            border-bottom: 2px solid theme('colors.outline-variant');
            background-color: transparent;
            transition: all 0.2s ease-in-out;
            font-family: theme('fontFamily.headline-md');
            font-size: 24px;
            color: theme('colors.on-surface');
        }
        .input-slot:focus {
            outline: none;
            border-bottom-color: theme('colors.primary');
        }
        .input-slot.filled {
            border-bottom-color: theme('colors.primary');
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md">
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-sm border border-surface-variant p-6 md:p-8">
<div class="mb-8">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant mb-6">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Verification</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Enter the 6-digit code we just sent to your phone number <br/>
<span class="font-label-md text-label-md text-on-surface mt-1 inline-block">+1 (555) 019-2834</span>
</p>
</div>
<form class="flex flex-col gap-8" id="otp-form">
<div class="flex justify-between gap-2 sm:gap-4 w-full max-w-sm mx-auto">
<input aria-label="Digit 1" autofocus="" class="input-slot rounded-t-DEFAULT focus:bg-surface-container-low" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 2" class="input-slot rounded-t-DEFAULT focus:bg-surface-container-low" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 3" class="input-slot rounded-t-DEFAULT focus:bg-surface-container-low" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 4" class="input-slot rounded-t-DEFAULT focus:bg-surface-container-low" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 5" class="input-slot rounded-t-DEFAULT focus:bg-surface-container-low" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 6" class="input-slot rounded-t-DEFAULT focus:bg-surface-container-low" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
</div>
<div class="text-center font-label-md text-label-md text-on-surface-variant">
                Didn't receive a code? 
                <button class="text-primary font-semibold hover:underline ml-1 focus:outline-none focus:ring-2 focus:ring-primary rounded-sm" id="resend-btn" type="button">
                    Resend Code <span class="font-normal inline-block w-8" id="timer">(0:59)</span>
</button>
</div>
<button class="w-full bg-primary text-on-primary py-3 px-6 rounded-full font-label-md text-label-md hover:bg-inverse-surface transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50 disabled:cursor-not-allowed mt-2" id="verify-btn" type="button">
                Verify
            </button>
</form>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.input-slot');
            const verifyBtn = document.getElementById('verify-btn');
            
            // Focus management for OTP inputs
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Allow only numbers
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    
                    if (e.target.value) {
                        e.target.classList.add('filled');
                        // Move to next input if available
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    } else {
                        e.target.classList.remove('filled');
                    }
                    
                    checkAllFilled();
                });

                input.addEventListener('keydown', (e) => {
                    // Handle backspace
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                        inputs[index - 1].classList.remove('filled');
                        checkAllFilled();
                    }
                });
            });

            function checkAllFilled() {
                const allFilled = Array.from(inputs).every(input => input.value.length === 1);
                // Can enable/disable button here if strict validation needed
                // verifyBtn.disabled = !allFilled;
            }

            // Simple timer countdown simulation
            const timerSpan = document.getElementById('timer');
            const resendBtn = document.getElementById('resend-btn');
            let timeLeft = 59;
            
            const countdown = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerSpan.textContent = '';
                    resendBtn.classList.remove('text-on-surface-variant');
                    resendBtn.classList.add('text-primary');
                } else {
                    timerSpan.textContent = `(0:${timeLeft.toString().padStart(2, '0')})`;
                    timeLeft--;
                }
            }, 1000);
        });
    </script>
</body></html>
