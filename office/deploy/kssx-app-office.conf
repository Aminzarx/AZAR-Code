# kssx.ir/app/office: the EYVAN office dashboard inside the one panel (Amin #5967). Included in the kssx.ir server
# block BEFORE the /app proxy (install root-owned: /etc/nginx/snippets/kssx-app-office.conf). The built dashboard
# (office/dist → /var/www/eyvan-office-app; office.kssx.ir only redirects here since 2026-10-29) and its calls under /app/office/api/ → azar-auth on loopback (only /office/…,
# never the advisers' /office/adviser/…). The panel's card opens /app/office/?h=<signed handoff> (POST /office/sso).
location = /app/office { return 301 /app/office/; }
location ^~ /app/office/api/office/adviser { return 404; }
location ^~ /app/office/api/office/ {
    limit_req zone=eyvan_api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8787/office/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /app/office/assets/ {
    alias /var/www/eyvan-office-app/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /app/office/ {
    alias /var/www/eyvan-office-app/;
    try_files $uri /app/office/index.html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
