# office.kssx.ir: the EYVAN office dashboard (Amin #5659/#5909/#5913/#5934). The built dashboard (office/dist →
# /var/www/eyvan-office) and, on the same address, only the calls it makes: the phone code (/auth/send-otp,
# /auth/verify-otp) and /office/… → azar-auth on loopback. The advisers' calls stay on the app's address.
# The exact server_name wins over the *.kssx.ir wildcard in digimeno.conf. Zone eyvan_api is defined in app.kssx.ir.conf.

server {
    listen 80;
    listen [::]:80;
    server_name office.kssx.ir;
    location /.well-known/acme-challenge/ { root /var/www/certbot-webroot; }
    location / { return 301 https://office.kssx.ir$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name office.kssx.ir;
    ssl_certificate     /etc/letsencrypt/live/kssx.ir/fullchain.pem;   # *.kssx.ir
    ssl_certificate_key /etc/letsencrypt/live/kssx.ir/privkey.pem;

    root /var/www/eyvan-office;
    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /office/adviser { return 404; }

    location ~ ^/(office/|auth/send-otp$|auth/verify-otp$) {
        limit_req zone=eyvan_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }
}
