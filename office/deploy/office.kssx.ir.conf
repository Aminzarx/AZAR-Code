# office.kssx.ir → kssx.ir/app/office/ (Amin #5967: one panel, one address). The office dashboard and its sign-in
# («ورود با ایوان» or username + password, Amin #6033/#6034) live inside the panel now; this name only redirects.
# The exact server_name wins over the *.kssx.ir wildcard in digimeno.conf.

server {
    listen 80;
    listen [::]:80;
    server_name office.kssx.ir;
    location /.well-known/acme-challenge/ { root /var/www/certbot-webroot; }
    location / { return 301 https://kssx.ir/app/office/; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name office.kssx.ir;
    ssl_certificate     /etc/letsencrypt/live/kssx.ir/fullchain.pem;   # *.kssx.ir
    ssl_certificate_key /etc/letsencrypt/live/kssx.ir/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / { return 301 https://kssx.ir/app/office/; }
}
